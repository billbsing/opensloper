# Builds OpenSloper for Linux, macOS and Windows on every push to the release
# branch, and publishes the downloads as the GitHub release of the version in
# Sloper.Core.Version (tag vVERSION). Until the version changes, each push
# replaces that release's downloads and moves its tag to the new commit; a
# 0.x version is marked as a pre-release.
#
# Run it by hand (Actions -> Release -> Run workflow) on any branch to try the
# builds: they are kept as workflow artifacts, and only the release branch
# publishes them.
#
# Toolchains are the Lazarus 4.8 releases, checked against SHA-256 sums taken
# from downloads that matched the MD5 sums on lazarus-ide.org: on Linux FPC
# 3.2.2 (as in ci.yml), on Windows the installer with FPC 3.2.2, and on macOS
# the Lazarus 4.8 build with the FPC 3.2.4rc1 package it is released with, as
# FPC 3.2.2 does not support current macOS.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

# A release being published is never cancelled part way
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  LAZARUS_RELEASE: "4.8"

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    env:
      LAZARUS_DEBS: >-
        fpc-laz_3.2.2-210709_amd64.deb
        fpc-src_3.2.2-210709_amd64.deb
        lazarus-project_4.8.0-0_amd64.deb
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache the Lazarus packages
        id: debs
        uses: actions/cache@v6
        with:
          path: debs
          key: lazarus-debs-${{ env.LAZARUS_RELEASE }}

      - name: Download the Lazarus packages
        if: steps.debs.outputs.cache-hit != 'true'
        run: |
          mkdir -p debs
          base="https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%20${LAZARUS_RELEASE}"
          for deb in $LAZARUS_DEBS; do
            curl -fsSL --retry 5 --retry-delay 10 -o "debs/$deb" "$base/$deb/download"
          done

      - name: Verify and install FPC, Lazarus and Qt6
        run: |
          cd debs
          sha256sum -c <<'EOF'
          92000f2b831184e153aab0c910f8ae9240450e5c6d76dc189cf53116ee501d83  fpc-laz_3.2.2-210709_amd64.deb
          8c9e145d8056754a9ca39ce3e52e982b8e4816124984c5f542f2a874e721ad53  fpc-src_3.2.2-210709_amd64.deb
          401742cefb01ad99a628188034bf728fb5360d641ed2be5f91fb0ee183a301cd  lazarus-project_4.8.0-0_amd64.deb
          EOF
          cd ..
          sudo apt-get update -q
          sudo apt-get install -y -q $(for deb in $LAZARUS_DEBS; do echo "./debs/$deb"; done) \
            qt6-base-dev qt6-qpa-plugins patchelf xvfb
          fpc -iV
          lazbuild --version

      # Ubuntu packages them only from 26.04, so they are built from Lazarus's
      # own sources for its Qt6 widgetset, and shipped in the download
      - name: Build the Qt6 Pascal bindings
        run: |
          # The .deb puts Lazarus in /usr/share/lazarus/VERSION
          src=$(find /usr/share/lazarus /usr/lib/lazarus -type d -path '*/lcl/interfaces/qt6/cbindings' 2>/dev/null | head -1)
          if [ -z "$src" ]; then
            echo "::error::The Qt6 binding sources (lcl/interfaces/qt6/cbindings) are not in the Lazarus install"
            exit 1
          fi
          cp -R "$src" "$RUNNER_TEMP/qt6pas"
          cd "$RUNNER_TEMP/qt6pas"
          qmake6 Qt6Pas.pro
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          echo "BUNDLE_LIBS=$(ldconfig -p | sed -n 's/.*libQt6Pas\.so\.6 .*=> //p' | head -1)" >> "$GITHUB_ENV"

      - name: Tests and leak check
        run: ./run-tests.sh

      - name: Build
        env:
          LCL_WIDGETSET: qt6
        run: ./build.sh

      - name: Package
        run: ./package.sh

      # From outside the source tree, so the data must come from the download,
      # and with the bindings built here removed, so they must come from it too
      - name: Try the download
        run: |
          sudo rm -f /usr/lib/x86_64-linux-gnu/libQt6Pas.so*
          sudo ldconfig
          mkdir -p "$RUNNER_TEMP/try"
          tar -C "$RUNNER_TEMP/try" -xzf release/dist/*.tar.gz
          cd "$RUNNER_TEMP"/try/opensloper-*
          ldd ./opensloper-design | grep 'libQt6Pas.so.6 => .*/lib/libQt6Pas.so.6'
          ./opensloper-cli --version
          ./opensloper-cli check "$GITHUB_WORKSPACE/docs/examples/skirt-block/skirt-block.sloper" \
            -m "$GITHUB_WORKSPACE/docs/examples/skirt-block/skirt.slm"
          # Still running after 15 seconds means it started
          status=0
          timeout 15 xvfb-run -a ./opensloper-design || status=$?
          if [ "$status" -ne 124 ]; then
            echo "::error::opensloper-design exited with $status during start-up"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: opensloper-linux-x86_64
          path: release/dist/*
          if-no-files-found: error

  macos:
    name: macOS arm64
    # The current Apple silicon image: GitHub retires older ones (macos-14 is gone)
    runs-on: macos-latest
    env:
      LAZARUS_ZIP: lazarus-darwin-aarch64-4.8.zip
      FPC_DMG: fpc-3.2.4rc1a.intelarm64-macosx.dmg
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache the Lazarus downloads
        id: downloads
        uses: actions/cache@v6
        with:
          path: downloads
          key: lazarus-macos-arm64-${{ env.LAZARUS_RELEASE }}

      - name: Download Lazarus and FPC
        if: steps.downloads.outputs.cache-hit != 'true'
        run: |
          mkdir -p downloads
          base="https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20aarch64/Lazarus%20${LAZARUS_RELEASE}"
          for file in "$LAZARUS_ZIP" "$FPC_DMG"; do
            curl -fsSL --retry 5 --retry-delay 10 -C - -o "downloads/$file" "$base/$file/download"
          done

      - name: Verify and install FPC and Lazarus
        run: |
          cd downloads
          shasum -a 256 -c <<'EOF'
          e5e0bf52bca911d4605dc875bd924ff5c74a0d0f6cf5699b936b377cc1986d1b  lazarus-darwin-aarch64-4.8.zip
          e7792c59a31982a00021566d1ab63b0c794ff87d63b6123fe0f45e8f5627f798  fpc-3.2.4rc1a.intelarm64-macosx.dmg
          EOF
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/fpc-dmg" "$FPC_DMG"
          sudo installer -pkg "$(find "$RUNNER_TEMP/fpc-dmg" -name '*.pkg' | head -1)" -target /
          hdiutil detach "$RUNNER_TEMP/fpc-dmg"
          unzip -q "$LAZARUS_ZIP" -d "$RUNNER_TEMP"
          cd ..
          brew install librsvg
          fpc -iV
          echo "LAZBUILD=$RUNNER_TEMP/lazarus/lazbuild" >> "$GITHUB_ENV"
          echo "LAZARUS_PCP=$RUNNER_TEMP/lazarus-config" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh --lazarusdir="$RUNNER_TEMP/lazarus" --compiler="$(command -v fpc)"

      - name: Package
        run: ./package.sh

      - name: Try the download
        run: |
          mkdir -p "$RUNNER_TEMP/try"
          ditto -x -k release/dist/*.zip "$RUNNER_TEMP/try"
          cd "$RUNNER_TEMP"/try/opensloper-*/OpenSloper.app/Contents/MacOS
          codesign --verify --deep --strict ../..
          ./opensloper-cli --version
          ./opensloper-cli check "$GITHUB_WORKSPACE/docs/examples/skirt-block/skirt-block.sloper" \
            -m "$GITHUB_WORKSPACE/docs/examples/skirt-block/skirt.slm"
          ./opensloper-design &
          app=$!
          sleep 15
          if ! kill -0 "$app" 2>/dev/null; then
            wait "$app" || status=$?
            echo "::error::opensloper-design exited with ${status:-0} during start-up"
            exit 1
          fi
          kill "$app"

      - uses: actions/upload-artifact@v7
        with:
          name: opensloper-macos-arm64
          path: release/dist/*
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      LAZARUS_EXE: lazarus-4.8-fpc-3.2.2-win64.exe
      LAZARUS_DIR: C:\lazarus
    steps:
      # The shell scripts must keep their Unix line ends
      - name: Keep line ends
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache the Lazarus installer
        id: downloads
        uses: actions/cache@v6
        with:
          path: downloads
          key: lazarus-windows-x86_64-${{ env.LAZARUS_RELEASE }}

      - name: Download the Lazarus installer
        if: steps.downloads.outputs.cache-hit != 'true'
        run: |
          mkdir -p downloads
          base="https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%20${LAZARUS_RELEASE}"
          curl -fsSL --retry 5 --retry-delay 10 -o "downloads/$LAZARUS_EXE" "$base/$LAZARUS_EXE/download"

      - name: Verify the Lazarus installer
        run: |
          cd downloads
          sha256sum -c <<'EOF'
          ed25ee171d55e23cf14e0633159fdd2325efba56e186f8ab817ad3bf97d267d7  lazarus-4.8-fpc-3.2.2-win64.exe
          EOF

      - name: Install Lazarus
        shell: pwsh
        run: |
          $installer = Start-Process -FilePath "downloads\$env:LAZARUS_EXE" -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$env:LAZARUS_DIR"
          if ($installer.ExitCode -ne 0) { throw "The Lazarus installer exited with $($installer.ExitCode)" }
          & "$env:LAZARUS_DIR\fpc\3.2.2\bin\x86_64-win64\fpc.exe" -iV

      - name: Build
        env:
          LAZBUILD: C:/lazarus/lazbuild.exe
        run: |
          ./build.sh --pcp="$RUNNER_TEMP/lazarus-config" --lazarusdir=C:/lazarus \
            --compiler=C:/lazarus/fpc/3.2.2/bin/x86_64-win64/fpc.exe

      - name: Package
        env:
          STRIP: C:/lazarus/fpc/3.2.2/bin/x86_64-win64/strip.exe
        run: ./package.sh

      - name: Try the download
        run: |
          TRY="$(cygpath -u "$RUNNER_TEMP")/try"
          EXAMPLE="$(cygpath -u "$GITHUB_WORKSPACE")/docs/examples/skirt-block"
          mkdir -p "$TRY"
          7z x -bso0 -o"$TRY" release/dist/*.zip
          cd "$TRY"/opensloper-*
          ./opensloper-cli.exe --version
          ./opensloper-cli.exe check "$EXAMPLE/skirt-block.sloper" -m "$EXAMPLE/skirt.slm"

      - name: Try starting the design app
        shell: pwsh
        run: |
          $folder = Get-ChildItem "$env:RUNNER_TEMP\try" -Directory | Select-Object -First 1
          $app = Start-Process -FilePath (Join-Path $folder.FullName 'opensloper-design.exe') -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "opensloper-design exited with $($app.ExitCode) during start-up" }
          Stop-Process -Id $app.Id

      - uses: actions/upload-artifact@v7
        with:
          name: opensloper-windows-x86_64
          path: release/dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [linux, macos, windows]
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/^ *APP_VERSION = '\(.*\)';.*/\1/p" src/core/sloper.core.version.pas)
          TAG="v$VERSION"
          PRERELEASE=false
          case "$VERSION" in 0.*) PRERELEASE=true ;; esac
          {
            echo "OpenSloper $VERSION, built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)."
            echo
            echo "| Download | For |"
            echo "| --- | --- |"
            echo "| \`opensloper-$VERSION-linux-x86_64.tar.gz\` | Linux x86_64; needs Qt 6.4 or later (the Qt6 Pascal bindings are included) |"
            echo "| \`opensloper-$VERSION-macos-arm64.zip\` | macOS 11 or later on Apple silicon |"
            echo "| \`opensloper-$VERSION-windows-x86_64.zip\` | Windows 10 or later, 64-bit |"
            echo
            echo "The programs are not signed: on macOS run \`xattr -cr OpenSloper.app\` once if it will not open,"
            echo "and on Windows choose More info, then Run anyway. README.txt in each download says more."
          } > notes.md
          # The tag follows the release branch until the version changes
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "OpenSloper $VERSION" --notes-file notes.md --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" --title "OpenSloper $VERSION" --notes-file notes.md --prerelease="$PRERELEASE" --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber
