# Builds the user documentation with Zensical and publishes it to GitHub
# Pages. The reference pages in docs/reference/ are generated from the
# program and committed (see build-docs.sh), so no Pascal build is needed here.
name: Documentation
on:
  push:
    branches:
      - development
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'requirements.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install -r requirements.txt
      - run: zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: release/site_docs
      - uses: actions/deploy-pages@v5
        id: deployment
