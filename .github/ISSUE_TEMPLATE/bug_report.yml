name: Bug report
description: Something in OpenSloper doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Please search the [open issues](https://github.com/billbsing/opensloper/issues) and `documents/known-issues.md` first.
        Report security problems privately instead, as described in [SECURITY.md](https://github.com/billbsing/opensloper/blob/development/SECURITY.md).
  - type: dropdown
    id: app
    attributes:
      label: App
      description: Which program shows the problem?
      options:
        - opensloper-design
        - opensloper-measurements
        - opensloper-publish
        - opensloper-cli
        - Automation API (opensloper-cli serve)
        - Building or tests
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong? Include any error message exactly as shown.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Open the attached pattern
        2. Select point A3 and drag it
        3. ...
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Attach the pattern, measurement or layout file that shows the problem, and a screenshot if it helps. Zip the files if GitHub won't accept them.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, or the output of `git rev-parse --short HEAD` if you built it yourself.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      description: For example "Manjaro Linux, Qt6", "Windows 11" or "macOS 15".
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Lazarus/FPC version if you built it yourself, console output, or anything else that might help.
