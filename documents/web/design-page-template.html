<title>OpenSloper Design Document</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: a reference manual, contents rail beside one readable column; a millimetre rule under the masthead. */
:root {
  --paper: #f7f8f6; --ink: #1f2a2e; --muted: #5a686d; --line: #d5dcda;
  --chalk: #1f6f8b; --wash: #e9efee; --code: #eef2f0;
  --serif: "Source Serif 4", Georgia, serif;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #14191b; --ink: #e3e9e8; --muted: #9aa9ad; --line: #2e383b;
  --chalk: #6cc0dc; --wash: #1d2528; --code: #20292c; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #14191b; --ink: #e3e9e8; --muted: #9aa9ad; --line: #2e383b;
  --chalk: #6cc0dc; --wash: #1d2528; --code: #20292c; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 17px/1.6 var(--serif);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.masthead { max-width: 1180px; margin: 0 auto; padding-block: 32px 0 }
.masthead .source { font: 14px/1.5 var(--sans); color: var(--muted); max-width: 70ch; margin: 0 0 18px }
.masthead .source code { font-size: 13px }
.rule { height: 14px; border-top: 1px solid var(--line);
  background-image: repeating-linear-gradient(90deg, var(--muted) 0 1px, transparent 1px 50px), repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 10px);
  background-size: 100% 12px, 100% 6px; background-repeat: no-repeat }
.frame { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 48px; padding-block: 24px 80px }
nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; max-height: calc(100vh - 32px); overflow-y: auto; font: 14px/1.4 var(--sans) }
nav .label { font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--muted); margin: 0 0 8px }
nav ul { list-style: none; margin: 0; padding: 0 }
nav ul ul { padding-left: 12px; margin-bottom: 4px; font-size: 13px }
nav a { display: block; padding: 3px 0; color: var(--ink); text-decoration: none }
nav a:hover { color: var(--chalk) }
main { min-width: 0; max-width: 74ch }
h1, h2, h3, h4 { font-family: var(--sans); font-weight: 600; line-height: 1.25; text-wrap: balance }
h1 { font-size: 34px; margin: 0 0 8px }
h2 { font-size: 24px; margin: 2.2em 0 .6em; padding-top: .5em; border-top: 1px solid var(--line); scroll-margin-top: 16px }
h3 { font-size: 18px; margin: 1.8em 0 .5em; scroll-margin-top: 16px }
a { color: var(--chalk) }
a:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px }
p, ul, ol { margin: 0 0 1em }
li { margin-bottom: .35em }
code { font: .86em var(--mono); background: var(--code); padding: .1em .3em; border-radius: 3px; overflow-wrap: anywhere }
pre { background: var(--code); padding: 12px 14px; border-radius: 4px; overflow-x: auto; font-size: 14px; line-height: 1.45 }
pre code { background: none; padding: 0; overflow-wrap: normal }
.table { overflow-x: auto; margin: 0 0 1.4em }
table { border-collapse: collapse; font: 14.5px/1.45 var(--sans); width: 100% }
th { text-align: left; font-weight: 600; background: var(--wash) }
th, td { border-bottom: 1px solid var(--line); padding: 7px 10px; vertical-align: top }
@media (max-width: 860px) {
  .frame { grid-template-columns: minmax(0, 1fr); gap: 24px }
  nav { position: static; max-height: 280px; border: 1px solid var(--line); padding: 12px; border-radius: 4px }
  main { max-width: none }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth } }
</style>
